<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F3EF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dayly" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Dayly</title>
    <script>
      // Theme and accent before the first paint, so a dark phone does not flash light.
      try {
        var theme = JSON.parse(localStorage.getItem('dayly:data') || 'null')?.settings?.theme || 'auto';
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.accent = JSON.parse(localStorage.getItem('dayly:ui') || 'null')?.accent || 'amber';
      } catch (e) {
        document.documentElement.dataset.theme = 'auto';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
